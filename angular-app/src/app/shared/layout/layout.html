<div class="shell">
  <header class="header">
    <div class="inner">
      <span class="brand">Angular 22</span>
      <nav class="nav">
        @for (link of links; track link.path) {
          <a
            class="link"
            [routerLink]="link.path"
            routerLinkActive="linkActive"
            [routerLinkActiveOptions]="{ exact: link.exact }"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
