<div class="field">
  <label [class]="hideLabel() ? 'labelHidden' : 'label'" [for]="controlId()">{{ label() }}</label>

  <input
    class="input"
    [class.invalid]="showError()"
    [id]="controlId()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-invalid]="showError() ? true : null"
    [attr.aria-describedby]="showError() ? controlId() + '-error' : null"
    autocomplete="off"
    (input)="onInput($event)"
    (blur)="touch.emit()"
  />

  @if (showError()) {
    <span class="error" role="alert" [id]="controlId() + '-error'">{{ errorMessage() }}</span>
  }
</div>
