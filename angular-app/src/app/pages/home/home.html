<section class="page">
  <h1 class="title">Démo Angular 22</h1>
  <p class="intro">
    Version Angular de la comparaison. Router pour le routage, Signal Forms pour les formulaires,
    service HttpClient pour les données, CDK Dialog pour la modale, SCSS encapsulé pour les styles.
  </p>

  <div class="cards">
    @for (card of cards; track card.path) {
      <app-card [title]="card.title" [text]="card.text" [link]="card.path" />
    }
  </div>
</section>
