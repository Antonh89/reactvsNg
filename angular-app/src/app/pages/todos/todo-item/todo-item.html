<label class="toggle">
  <input appCheckbox type="checkbox" [checked]="todo().completed" (change)="toggled.emit(todo())" />
  <span class="label">{{ todo().title }}</span>
</label>

<button
  appButton
  type="button"
  variant="ghost"
  [attr.aria-label]="'Supprimer « ' + todo().title + ' »'"
  (click)="deleteRequested.emit(todo())"
>
  Supprimer
</button>
