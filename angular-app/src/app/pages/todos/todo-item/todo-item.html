<label class="toggle">
  <input appCheckbox type="checkbox" [checked]="todo().completed" (change)="toggled.emit(todo())" />
  <span class="label">{{ todo().title }}</span>
</label>

<!-- Tant que l'API n'a pas renvoyé d'identifiant, il n'y a rien à supprimer côté serveur. -->
@if (todo().id !== undefined) {
  <button
    appButton
    type="button"
    variant="ghost"
    [attr.aria-label]="'Supprimer « ' + todo().title + ' »'"
    (click)="deleteRequested.emit(todo())"
  >
    Supprimer
  </button>
} @else {
  <span class="pending">Création en cours</span>
}
