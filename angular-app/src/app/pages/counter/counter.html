<section class="page">
  <h1 class="title">Compteur</h1>
  <p class="intro">
    État local avec <code>signal()</code>, mis à jour par trois liaisons <code>(click)</code>.
  </p>

  <div class="card">
    <output class="value">{{ count() }}</output>

    <div class="actions">
      <button appButton type="button" variant="secondary" (click)="decrement()">
        − Décrémenter
      </button>
      <button appButton type="button" variant="ghost" [disabled]="count() === 0" (click)="reset()">
        Réinitialiser
      </button>
      <button appButton type="button" (click)="increment()">+ Incrémenter</button>
    </div>
  </div>
</section>
